# Render Blueprint for the Django backend (the Next.js frontend is on Vercel).
# Set-up steps: backend/README.md, "Deploying to Render".
services:
  - type: web
    name: upcz-backend
    runtime: python
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Pre-deploy commands are paid-only on Render, so migrations run at start.
    # Both commands are safe to repeat on every start.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py setup_roles &&
      python manage.py flushexpiredtokens &&
      gunicorn church_erp.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DJANGO_SETTINGS_MODULE
        value: church_erp.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Shared secret for POST /api/tasks/sync-youtube/ (the free plan has no cron jobs).
      - key: SYNC_TOKEN
        generateValue: true
      # Supabase "Session pooler" connection string: Render can't reach the
      # IPv6-only direct connection.
      - key: DATABASE_URL
        sync: false
      # The Vercel site's URL(s), comma-separated.
      - key: FRONTEND_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Shared with the website's server for dashboard sign-in; see backend/README.md.
      - key: INTERNAL_API_SECRET
        sync: false
      # Cloudflare R2 for uploads; see backend/README.md "Storing uploads".
      # Blueprints only prompt for these when first created, so on an existing
      # service add them in the dashboard's Environment tab.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_PRIVATE_BUCKET_NAME
        sync: false
      - key: MEDIA_PUBLIC_DOMAIN
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
